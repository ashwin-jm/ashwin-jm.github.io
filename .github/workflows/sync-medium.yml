   name: Sync Medium posts

   on:
     schedule:
       - cron: "0 */3 * * *"   # every 3 hours
     workflow_dispatch:         # "Run workflow" button for right after you publish
     push:
       branches: [main]
       paths: ["scripts/fetch_medium.py", ".github/workflows/sync-medium.yml"]

   permissions:
     contents: write
     pages: write

   concurrency:
     group: sync-medium
     cancel-in-progress: true

   jobs:
     sync:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: Fetch Medium feed
           run: python scripts/fetch_medium.py

         - name: Commit if posts changed
           id: commit
           run: |
             if git diff --quiet -- assets/data/posts.json; then
               echo "No new posts."
               echo "changed=false" >> "$GITHUB_OUTPUT"
             else
               git config user.name  "github-actions[bot]"
               git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
               git add assets/data/posts.json
               git commit -m "Sync Medium posts"
               git push
               echo "changed=true" >> "$GITHUB_OUTPUT"
             fi

         - name: Rebuild GitHub Pages
           if: steps.commit.outputs.changed == 'true'
           continue-on-error: true
           env:
             GH_TOKEN: ${{ github.token }}
           run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
